name: Publish extension

on:
  push:
    branches:
      - main
      - release
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PUBLISHER_ID: xerillio
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Resolve publish target and environment variables
        shell: bash
        run: |
          if [ "${GITHUB_REF_NAME}" = "release" ]; then
            MANIFEST="vss-extension.release.json"
            PUBLISH_TARGET="release"
            IS_EXT_PUBLIC="true"
          else
            MANIFEST="vss-extension.dev.json"
            PUBLISH_TARGET="dev"
            IS_EXT_PUBLIC="false"
          fi

          BUILD_DATE="$(date -u +%Y%m%d)"
          VERSION="1.${BUILD_DATE}.${GITHUB_RUN_NUMBER}"

          # Generate consistent namespace based task UUID (v5)
          TASK_NAME="$(node scripts/get-task-name.js ".task/task.json")"
          EXTENSION_ID="$(node scripts/get-extension-id.js "$MANIFEST")"
          NAMESPACE="$(uuidgen --sha1 --namespace "@url" --name "https://marketplace.visualstudio.com/vsts")"
          TASK_ID="$(uuidgen --sha1 \
            --namespace "$NAMESPACE" \
            --name "${PUBLISHER_ID}.${EXTENSION_ID}.${TASK_NAME}")"

          # Write variables to GITHUB_ENV file for subsequent steps
          echo "MANIFEST=${MANIFEST}" >> "$GITHUB_ENV"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "PUBLISH_TARGET=${PUBLISH_TARGET}" >> "$GITHUB_ENV"
          echo "IS_EXT_PUBLIC=${IS_EXT_PUBLIC}" >> "$GITHUB_ENV"
          echo "TASK_ID=${TASK_ID}" >> "$GITHUB_ENV"

          echo "Resolved extension target: ${PUBLISH_TARGET} (${VERSION})"

      - name: Sync task metadata with extension version
        shell: bash
        run: node scripts/update-task-manifest.js ".task/task.json" "$VERSION" "$TASK_ID"

      - name: Package extension
        shell: bash
        run: |
          npx tfx-cli extension create \
            --manifests vss-extension.json "${MANIFEST}" \
            --publisher "$PUBLISHER_ID" \
            --override "{\"version\":\"${VERSION}\",\"public\":${IS_EXT_PUBLIC}}" \
            --output-path .

          VSIX_PATH=$(ls -1 *.vsix | head -n 1)
          echo "VSIX_PATH=${VSIX_PATH}" >> "$GITHUB_ENV"

          echo "Created package: ${VSIX_PATH}"

      - name: Publish extension to Visual Studio Marketplace
        if: ${{ secrets.MARKETPLACE_TOKEN != '' }}
        shell: bash
        env:
          MARKETPLACE_TOKEN: ${{ secrets.MARKETPLACE_TOKEN }}
        run: |
          set +x
          npx tfx-cli extension publish \
            --vsix "$VSIX_PATH" \
            --share-with "$PUBLISHER_ID" \
            --token "$MARKETPLACE_TOKEN" \
            --service-url https://marketplace.visualstudio.com \
            --no-prompt
